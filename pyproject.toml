[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cullwise"
version = "0.1.0"
description = "AI-assisted AppSec triage for CI/CD — turn scanner noise into a prioritized, class-clustered remediation report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jose Ernest", email = "unifosec@gmail.com" }]
keywords = ["appsec", "security", "sast", "semgrep", "triage", "llm", "ai"]
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
# LLM triage is optional: the tool degrades gracefully to heuristic triage
# so CI and offline runs never require an API key or network access.
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
cullwise = "cullwise.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
