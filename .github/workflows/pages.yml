name: Deploy dashboard

# Live dashboard: on every push to main, run Semgrep on the demo target,
# triage with Cullwise, and publish the HTML report to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Cullwise + Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install semgrep

      - name: Scan demo code with Semgrep (live)
        run: |
          semgrep scan --config=auto --json --output findings.json examples/vulnerable_demo || true

      - name: Assemble site (landing page + analyzer + sample report)
        run: |
          mkdir -p site
          cp web/index.html site/index.html          # landing page + in-browser analyzer
          if [ -s findings.json ] && python -c "import json,sys; sys.exit(0 if json.load(open('findings.json')).get('results') else 1)"; then
            echo "Using live Semgrep findings for the sample report."
            cullwise triage findings.json --out site/sample.html
          else
            echo "No live findings; using bundled sample."
            cullwise triage examples/semgrep-sample.json --out site/sample.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
